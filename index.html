<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Président 2000</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  /* Bureau rétro : fenêtres en relief sur fond sarcelle tramé, écran cathodique pour les sondages. Un seul thème, par choix. */
  --desk:#56797a; --desk2:#4d6e6f;
  --face:#cfcabb; --hi:#f6f3e8; --lo:#868271; --ink:#1d1c19; --ink2:#4a483f; --paper:#e9e5d7;
  --bar:#27375f; --bar2:#5b6ea3; --red:#a3423c; --green:#3a6b42; --gold:#c9a13a;
  --crt:#0e1712; --crt-grid:#1e3a2a; --crt-txt:#9fe2a8;
  --f-display:'Pixelify Sans','Trebuchet MS',Verdana,sans-serif;
  --f-body:Tahoma,Verdana,'DejaVu Sans',sans-serif;
  --f-crt:'VT323','Courier New',monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--desk);background-image:repeating-conic-gradient(var(--desk2) 0 25%,transparent 0 50%);background-size:4px 4px;color:var(--ink);font:14px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
#app{max-width:1340px;margin:0 auto;padding:10px 16px 28px;display:flex;flex-direction:column;gap:10px;min-height:100%}

.win{background:var(--face);border:2px solid;border-color:var(--hi) var(--ink2) var(--ink2) var(--hi);box-shadow:inset -2px -2px 0 var(--lo),inset 2px 2px 0 #e6e2d4,3px 3px 0 rgba(0,0,0,.28);padding:4px;min-width:0}
.tb{background:linear-gradient(90deg,var(--bar),var(--bar2));color:#fff;font:600 15px/1.1 var(--f-display);letter-spacing:.04em;padding:6px 8px;display:flex;align-items:center;gap:8px}
.tb::before{content:"";width:18px;height:12px;background:linear-gradient(90deg,#3b55a0 0 33.3%,#f4f1e6 0 66.6%,#b5463f 0);border:1px solid #111;flex:none}
.tb.alert{background:linear-gradient(90deg,#6e1f1c,var(--red))}
.wb{padding:10px;display:flex;flex-direction:column;gap:10px}
.btn{font:600 14px/1.2 var(--f-body);background:var(--face);border:2px solid;border-color:var(--hi) var(--ink) var(--ink) var(--hi);box-shadow:inset -1px -1px 0 var(--lo),inset 1px 1px 0 #fff;padding:8px 14px;min-height:40px;cursor:pointer}
.btn:active:not(:disabled),.act:active:not(:disabled){border-color:var(--ink) var(--hi) var(--hi) var(--ink);box-shadow:inset 1px 1px 0 var(--lo);transform:translate(1px,1px)}
.btn:disabled{color:var(--lo);text-shadow:1px 1px 0 var(--hi);cursor:default}
.btn:focus-visible,.act:focus-visible,.chip:focus-visible,.tabs button:focus-visible{outline:2px dotted var(--ink);outline-offset:-5px}
.btn.go{background:#d9d2a8}
.inset{background:var(--paper);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:inset 1px 1px 0 var(--ink2)}
.crt{background:var(--crt);color:var(--crt-txt);font-family:var(--f-crt);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
img.pt{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);background:#777;flex:none}
.ori{display:inline-block;font:600 11px/1 var(--f-body);color:#fff;padding:3px 6px;border:1px solid var(--ink);letter-spacing:.03em}
.fine{font-size:12px;color:var(--ink2)}

/* barre du haut */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 6px}
.brand{font:700 20px/1 var(--f-display);color:var(--bar);letter-spacing:.06em;text-shadow:1px 1px 0 var(--hi);display:flex;align-items:center;gap:8px}
.brand i{width:20px;height:14px;background:linear-gradient(90deg,#3b55a0 0 33.3%,#f4f1e6 0 66.6%,#b5463f 0);border:1px solid #111}
.brand b{color:var(--red)}
.top-info{font:20px/1 var(--f-crt);background:var(--crt);color:var(--crt-txt);padding:4px 10px;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);white-space:nowrap}
.top nav{margin-left:auto;display:flex;gap:6px}
.top nav .btn{min-height:34px;padding:4px 10px;font-size:13px}

/* accueil */
.hero .wb{align-items:center;text-align:center;gap:14px;padding:22px 14px 16px}
.parade{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.hero h1{font:700 clamp(40px,10vw,92px)/.95 var(--f-display);letter-spacing:.03em;color:var(--bar);text-shadow:3px 3px 0 var(--hi),6px 6px 0 rgba(0,0,0,.22)}
.hero h1 b{color:var(--red)}
.sub{font:600 clamp(15px,2.6vw,20px)/1.3 var(--f-display);color:var(--ink2);text-wrap:balance}
.menu{display:flex;flex-direction:column;gap:8px;width:min(360px,100%)}
.menu .btn{min-height:50px;font-size:16px}
.ticker{overflow:hidden;white-space:nowrap;font-size:22px;line-height:1;padding:6px 0}
.ticker span{display:inline-block;padding-left:100%;animation:tick 46s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

/* sélection */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 12px/1 var(--f-body);background:var(--face);border:2px solid;border-color:var(--hi) var(--ink) var(--ink) var(--hi);padding:8px 10px;min-height:36px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--ink) var(--hi) var(--hi) var(--ink);background:var(--paper);box-shadow:inset 1px 1px 0 var(--lo)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cc{padding:10px;display:flex;flex-direction:column;gap:8px}
.cc-h{display:flex;gap:10px;align-items:flex-start}
.cc h3{font:700 17px/1.15 var(--f-display)}
.cc .party{font-size:12px;color:var(--ink2);margin:2px 0 5px}
.cc .bio{font-size:13px;flex:1}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;cursor:pointer;font:inherit;background:var(--paper)}
.mode svg{width:48px;height:48px;color:var(--bar)}
.mode h3{font:700 20px/1.1 var(--f-display)}
.mode:hover{background:#f1eee2}
.mode .btnlike{margin-top:auto;font-weight:700;color:var(--bar)}
.picked{display:flex;gap:10px;align-items:center}

/* tableau de bord */
#game{display:grid;gap:10px;grid-template-columns:minmax(330px,1.1fr) minmax(320px,1fr) minmax(270px,.85fr);align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.cand-row{display:flex;gap:12px;align-items:center}
.cand-row h2{font:700 22px/1.1 var(--f-display)}
.cand-row p{font-size:13px;color:var(--ink2);margin:2px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kpi{padding:6px 4px;text-align:center;min-width:0}
.kpi small{display:block;font-size:11px;color:#7fb48a;letter-spacing:.04em;font-family:var(--f-body)}
.kpi b{font:400 clamp(22px,6.2vw,30px)/1 var(--f-crt);white-space:nowrap}
.notes li{padding:5px 8px 5px 22px;position:relative;font-size:13px}
.notes li::before{content:"▸";position:absolute;left:8px;color:var(--bar)}
.acts{display:grid;gap:6px}
.act{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--face);border:2px solid;border-color:var(--hi) var(--ink) var(--ink) var(--hi);box-shadow:inset -1px -1px 0 var(--lo),inset 1px 1px 0 #fff;padding:9px 10px;cursor:pointer;min-height:56px}
.act:hover:not(:disabled){background:#d9d5c7}
.act:disabled{cursor:default;color:var(--lo);box-shadow:none}
.act:disabled b{text-shadow:1px 1px 0 var(--hi)}
.act:disabled em,.act:disabled svg{color:var(--lo)}
.act svg{width:36px;height:36px;flex:none;color:var(--bar);background:var(--paper);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:3px}
.act b{display:block;font:700 16px/1.15 var(--f-display)}
.act em{display:block;font-style:normal;font-size:12.5px;color:var(--ink2);margin-top:2px}
.chartbox{padding:6px}
#chart{display:block;width:100%;height:230px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;padding:2px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;border:1px solid var(--ink);vertical-align:-1px}
.rows{max-height:520px;overflow-y:auto}
.row{display:grid;grid-template-columns:26px 24px minmax(0,1fr) 70px 56px;gap:6px;align-items:center;padding:3px 6px;border-bottom:1px solid #d3cfbf;font-size:13px}
.row .rk{font:20px/1 var(--f-crt);text-align:right;color:var(--ink2)}
.row .nm{overflow-wrap:anywhere;line-height:1.2}
.row .nm small{display:block;color:var(--ink2);font-size:11px}
.row .sc{font:20px/1 var(--f-crt);text-align:right;white-space:nowrap}
.row .dl{font:600 11.5px/1 var(--f-body);text-align:right;white-space:nowrap}
.up{color:var(--green)}.dn{color:var(--red)}.eq{color:var(--lo)}
.row.me{background:#f3e7a9;outline:2px solid var(--gold);outline-offset:-2px}
.row.out{color:var(--lo)}
.row.out .sc{font:12px var(--f-body)}
.row img.pt{border-width:1px}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px}
.duel .side{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12.5px}
.duel .side b{font:400 34px/1 var(--f-crt)}
.duel .vs{font:700 20px var(--f-display);color:var(--red)}
.bar2{height:18px;display:flex;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.bar2 i{display:block;background:var(--gold)}.bar2 u{display:block;flex:1;background:var(--bar2)}
.src{font-size:11px;color:var(--ink2)}
.news{max-height:640px;overflow-y:auto}
.nw{padding:8px 10px;border-bottom:2px groove var(--hi)}
.nw h4{margin:0 0 4px;font:700 14px/1.2 var(--f-display);color:var(--bar);letter-spacing:.03em}
.nw li{font-size:13px;padding:3px 0 3px 16px;position:relative}
.nw li::before{content:"■";position:absolute;left:0;top:5px;font-size:8px;color:var(--lo)}
.nw li.good::before{color:var(--green)}.nw li.bad::before{color:var(--red)}.nw li.dead::before{color:#000}
.nw li.dead{font-weight:700}.nw li.you{background:#f3e7a9}
.nw details{margin-top:4px;font-size:12.5px}
.nw summary{cursor:pointer;color:var(--bar);font-weight:700;padding:4px 0}
.tabs{display:none}

/* fenêtres modales */
.ovl{position:fixed;inset:0;background:rgba(20,30,30,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.ovl.flash{animation:flash .7s steps(4)}
@keyframes flash{0%,50%{background:rgba(163,66,60,.85)}25%,75%{background:rgba(246,243,232,.8)}}
.modal{width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;animation:pop .18s steps(3)}
.modal.shake{animation:shake .5s steps(6)}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,3px)}}
.modal .wb{overflow-y:auto}
.modal h3{font:700 22px/1.15 var(--f-display);text-wrap:balance}
.blk{padding:9px 10px}
.blk li{padding:2px 0}
.blk h4{margin:0 0 4px;font:700 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--bar)}
.blk.flashinfo{background:#2a1513;color:#f6dcd6;border-color:#000}
.blk.flashinfo h4{color:#ffb1a5}
.quote{font-style:italic}
.evo{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 12px}
.evo .big{font-size:40px;line-height:1}
.evo small{font:12px var(--f-body);color:#7fb48a;display:block}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:0 10px 10px}
.help li{padding:4px 0 4px 18px;position:relative}
.help li::before{content:"▸";position:absolute;left:2px;color:var(--bar)}
.vsrow{display:flex;justify-content:center;align-items:center;gap:16px;text-align:center;font-weight:700}
.vsrow span{font:700 26px var(--f-display);color:var(--red)}

/* fin */
.endgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px}
.endhead{display:flex;gap:14px;align-items:center}
.endhead h2{font:700 clamp(26px,5vw,42px)/1 var(--f-display);text-wrap:balance}
.recap{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;padding:8px 10px}
.recap dt{color:var(--ink2)}.recap dd{margin:0;font-weight:700}

@media (max-width:979px){
  #app{padding:8px 16px 84px}
  #game{grid-template-columns:1fr}
  #game[data-tab=camp] .col:not([data-tab=camp]),#game[data-tab=sond] .col:not([data-tab=sond]),#game[data-tab=actu] .col:not([data-tab=actu]){display:none}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--face);border-top:2px solid var(--hi);box-shadow:0 -2px 0 var(--ink2);padding:6px 16px calc(6px + env(safe-area-inset-bottom));gap:6px}
  .tabs button{font:700 15px/1 var(--f-display);min-height:52px;background:var(--face);border:2px solid;border-color:var(--hi) var(--ink) var(--ink) var(--hi);cursor:pointer}
  .tabs button[aria-pressed=true]{border-color:var(--ink) var(--hi) var(--hi) var(--ink);background:var(--paper)}
  .rows,.news{max-height:none}
  .act{min-height:64px}
  .endgrid{grid-template-columns:1fr}
  .brand{font-size:17px}
  .top-info{order:3;flex:1 1 100%;text-align:center;min-width:0;overflow:hidden;font-size:18px}
}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:0;white-space:normal}.ticker{white-space:normal}.modal,.modal.shake,.ovl.flash{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* =====================================================================
   DONNÉES — tout est fictif. Pour ajouter, modifier ou retirer un candidat,
   il suffit d'éditer ce tableau : le moteur rééquilibre les scores à 100 %.
   statut : 'declare' (jouable), 'envisage' ou 'retire' (non proposés).
   base : score de départ du mode « baromètre », en points.
   p : portrait [teint 0-4, coiffure, couleur cheveux, accessoires, couleur veste]
   ===================================================================== */
var ORI={EG:{n:'Extrême gauche',c:'#9a3c3c'},G:{n:'Gauche',c:'#b0627c'},C:{n:'Centre',c:'#a08430'},D:{n:'Droite',c:'#46689a'},ED:{n:'Extrême droite',c:'#3b4263'},SE:{n:'Sans étiquette',c:'#667564'}};
var ORDRE=['EG','G','C','D','ED','SE'];
var TOUS=[
{id:'faucillon',nom:'Bérénice Faucillon',g:'f',parti:'Front du Grand Soir Permanent',o:'EG',base:10,bio:"Annonce le Grand Soir pour lundi prochain depuis 1998. Son discours de victoire tient déjà en trois tomes.",marotte:"nationaliser les machines à café du CAC 40",p:[0,'bob','r','ef','#7a2e2e']},
{id:'piquet',nom:'Octave Piquet',g:'m',parti:'Grève Générale Illimitée',o:'EG',base:1,bio:"Délégué syndical depuis le CM2. N'a jamais quitté une réunion sans faire voter une motion.",marotte:"instaurer un droit de grève préventif, au cas où",p:[1,'short','n','mc','#5b3a3a']},
{id:'barricade',nom:'Lucette Barricade',g:'f',parti:'Ligue des Camarades Vraiment Fâchés',o:'EG',base:0.5,bio:"Candidate pour la sixième fois. Son tract n'a pas changé d'une virgule, et elle en est fière.",marotte:"remplacer la Bourse par une tombola",p:[0,'bun','g','g','#6d3434']},
{id:'pave',nom:'Marius Pavé',g:'m',parti:'Collectif Sous les Pavés',o:'EG',base:0.5,bio:"Ancien cheminot, vedette des assemblées générales. Vote à main levée même pour choisir son dessert.",marotte:"réquisitionner les yachts pour en faire des colonies de vacances",p:[3,'curly','n','b','#4d4a44']},
{id:'roseraie',nom:'Clémentine Roseraie',g:'f',parti:'Union de la Gauche Désunie',o:'G',base:8,bio:"Tente de rassembler la gauche depuis quinze ans. A réussi une fois, le temps d'un déjeuner.",marotte:"organiser un congrès de l'unité, puis un second pour s'en remettre",p:[1,'long','c','e','#a8576f']},
{id:'compost',nom:'Gaspard Compost',g:'m',parti:'Les Verts de Rage',o:'G',base:4.5,bio:"Se déplace uniquement à vélo cargo, y compris pour aller à Bruxelles. Arrive en retard, mais décarboné.",marotte:"rendre le compost obligatoire dans les ministères",p:[0,'long','b','b','#4c7a4a']},
{id:'lacagnotte',nom:'Honorine Lacagnotte',g:'f',parti:'Mouvement pour la Retraite à 35 Ans',o:'G',base:2.5,bio:"Ancienne comptable. Jure que tout est finançable « en cherchant bien sous les coussins ».",marotte:"abaisser l'âge de la retraite à 35 ans, pot de départ remboursé",p:[2,'bun','n','g','#8c5a6b']},
{id:'velocipede',nom:'Théodule Vélocipède',g:'m',parti:'Alliance Cyclable et Solidaire',o:'G',base:1,bio:"Maire d'une commune de 312 habitants et de 400 pistes cyclables.",marotte:"transformer le périphérique en vélodrome",p:[0,'bald','g','gm','#5f8a5a']},
{id:'synthese',nom:'Margaux Synthèse',g:'f',parti:'Parti du Compromis Introuvable',o:'G',base:0.5,bio:"Spécialiste des motions de synthèse. Concilie deux positions opposées en une phrase de quatre pages.",marotte:"créer un droit opposable à la motion de synthèse",p:[0,'bob','bl','','#9a6a80']},
{id:'canape',nom:'Firmin Canapé',g:'m',parti:'La Gauche du Canapé',o:'G',base:1.5,bio:"Milite surtout depuis son salon. Redoutable sur les pétitions en ligne.",marotte:"autoriser le télétravail pour les manifestations",p:[1,'curly','c','g','#7c6a8a']},
{id:'quinoa',nom:'Perrine Quinoa',g:'f',parti:'Front du Potager Partagé',o:'G',base:0.5,bio:"Ingénieure reconvertie dans la permaculture. Parle à ses tomates, qui la soutiennent sans réserve.",marotte:"installer un potager partagé sur le toit de chaque préfecture",p:[4,'curly','n','ef','#55804f']},
{id:'dumilieu',nom:'Aymeric Dumilieu',g:'m',parti:'Ni Oui Ni Non',o:'C',base:14,bio:"Ancien haut fonctionnaire. N'a jamais pris position sans avoir d'abord commandé un rapport.",marotte:"lancer un grand débat national sur l'opportunité d'un grand débat national",p:[0,'side','c','gt','#3e4a66']},
{id:'tiede',nom:'Constance Tiède',g:'f',parti:"Parti de l'Extrême Centre",o:'C',base:6,bio:"Radicalement modérée. Ses meetings finissent à l'heure et sans applaudissements excessifs.",marotte:"fixer la température réglementaire des débats à 19 °C",p:[0,'bob','c','e','#8a7a4a']},
{id:'consensus',nom:'Jean-Eudes Consensus',g:'m',parti:'Rassemblement des Modérés Modérément Modérés',o:'C',base:2.5,bio:"A été ministre de quelque chose sous quelqu'un. Personne ne se rappelle quoi, lui non plus.",marotte:"créer une commission chargée d'évaluer les commissions",p:[1,'bald','w','t','#5c5a50']},
{id:'tableur',nom:'Sixtine Tableur',g:'f',parti:'Synergie & Tableurs',o:'C',base:1,bio:"Ancienne consultante. Présente son programme en 148 diapositives, dont une lisible.",marotte:"remplacer le Journal officiel par un tableau croisé dynamique",p:[2,'long','n','g','#3f5f7a']},
{id:'delarente',nom:'Charles-Henri de la Rente',g:'m',parti:'Union des Propriétaires Inquiets',o:'D',base:9,bio:"Héritier d'une longue lignée d'héritiers. Connaît le prix du pain « à quelques dizaines d'euros près ».",marotte:"défiscaliser les résidences tertiaires",p:[0,'side','w','tm','#2f3f66']},
{id:'cocorico',nom:'Bernadette Cocorico',g:'f',parti:"La France d'Avant-Hier",o:'D',base:5,bio:"Regrette une époque qu'elle n'a pas connue. Collectionne les porte-clés de sous-préfectures.",marotte:"rétablir le franc, le minitel et le service du dimanche",p:[0,'bun','w','eh','#3f5a8a']},

var rnd=Math.random;
function pick(a){return a[Math.floor(rnd()*a.length)];}
function rint(a,b){return a+Math.floor(rnd()*(b-a+1));}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function wpick(pairs){var t=0,i;for(i=0;i<pairs.length;i++)t+=pairs[i][1];var r=rnd()*t;for(i=0;i<pairs.length;i++){r-=pairs[i][1];if(r<=0)return pairs[i][0];}return pairs[pairs.length-1][0];}
function fu(u){return String(u/2).replace('.',',')+' %';}
function fd(u){return u===0?'=':(u>0?'+':'−')+String(Math.abs(u)/2).replace('.',',');}
function ord(n,f){return n===1?(f?'1re':'1er'):n+'e';}
function T(s,c,x){x=x||{};var f=c&&c.g==='f';
 return s.replace(/\{(\w+)\}/g,function(m,k){
  if(k==='N')return c.nom; if(k==='il')return f?'elle':'il'; if(k==='Il')return f?'Elle':'Il'; if(k==='e')return f?'e':''; if(k==='lui')return f?'elle':'lui';
  return x[k]!==undefined?x[k]:m;});}
function T2(s,c,x){return T(T(s,c,x),c,x);}

/* répartition entière (unités de 0,5 point) par plus forts restes, total garanti */
function repartir(w,total,min){
 var ids=Object.keys(w),sum=0,out={},used=0,fr=[],i;
 for(i=0;i<ids.length;i++)sum+=w[ids[i]];
 for(i=0;i<ids.length;i++){var ex=w[ids[i]]/sum*total,f=Math.floor(ex);if(f<min)f=min;out[ids[i]]=f;used+=f;fr.push([ids[i],ex-Math.floor(ex),rnd()]);}
 var rest=total-used;
 fr.sort(function(a,b){return b[1]-a[1]||b[2]-a[2];});
 var k=0;
 while(rest>0){out[fr[k%fr.length][0]]++;rest--;k++;}
 while(rest<0){var big=ids[0];for(i=1;i<ids.length;i++)if(out[ids[i]]>out[big])big=ids[i];out[big]--;rest++;}
 return out;}
function scoresDepart(mode){
 var w={},n=CANDS.length,i;
 if(mode==='egal'){var b=Math.floor(200/n),out={},extra=200-b*n,ids=CANDS.map(function(c){return c.id;});
  ids.forEach(function(id){out[id]=b;});
  ids.sort(function(){return rnd()-.5;});
  for(i=0;i<extra;i++)out[ids[i%n]]++;

function vivants(S){return S.phase==='p1'?CANDS.map(function(c){return c.id;}).filter(function(i){return S.c[i].alive;}):S.duel.filter(function(i){return S.c[i].alive;});}

function instantane(S){var o={};CANDS.forEach(function(c){o[c.id]=S.c[c.id].sc;});return o;}
function nouvellePartie(candId,mode){

 S.hist.p1.push(instantane(S));

var K_IA=0.6,K_PLAFOND=0.45,K_SERIE=-3;
function effet(S,id,pts,cur,duel){
 var st=S.c[id],f=duel?1:clamp(0.25+(cur/2)/13,0.3,1.25);
 if(pts>0)f*=(1+0.05*st.dyn)*(1+(st.pop-50)/300);else f*=(1-0.04*st.dyn)*(1-(st.pop-50)/300);
 if(!duel&&pts>0&&id!==S.me)f*=K_IA; /* léger avantage au joueur face à 27 concurrents */
 var u=Math.round(pts*2*f);if(u===0)u=pts>0?1:-1;
 if(!duel&&u<0){
  if(cur<2)u=st.dyn<=K_SERIE?-cur:0; /* au plancher, seule une mauvaise série fait tomber à 0 % */
  else u=-Math.min(-u,Math.min(Math.max(1,Math.round(cur*K_PLAFOND)),cur-1));}

/* règles d'usage : un seul livre par partie, une visite d'usine tous les trois tours au plus */
function attente(S,id){var st=S.c[id];return st.usineG==null?0:Math.max(0,3-(S.g-st.usineG));}
function dispo(S,id,act){if(act==='livre')return !S.c[id].livre;if(act==='usine')return attente(S,id)===0;return true;}
var FAT={discours:18,promesse:8,livre:14,tele:12,usine:20,repos:-45};
var CRED={discours:[2,-2],promesse:[1,-5],livre:[6,-8],tele:[5,-6],usine:[3,-3]};
function resoudre(S,id,act){
 var st=S.c[id],sh=(st.cred-50)/50*0.08+st.dyn*0.01;if(st.fat>50)sh-=(st.fat-50)/50*0.16;sh=clamp(sh,-0.2,0.12);
 var out,pts=0,r=rnd(),nProm=st.recent.filter(function(a){return a==='promesse';}).length;
 if(act==='discours'||act==='usine'){
  var pA=(act==='discours'?0.05:0.25)*clamp(1+(65-st.sec)/100,0.6,1.6);
  if(rnd()<pA){if(rnd()<0.5)out='mort';else{out='survie';pts=20;}}
  else if(r<clamp((act==='discours'?55/95:55/75)+sh,0.1,0.92)){out='ok';pts=act==='discours'?5:10;}
  else{out='ko';pts=-5;}
 }else if(act==='promesse'){if(r<0.6+sh-(nProm>=2?0.12:0)){out='ok';pts=2;}else{out='ko';pts=-2;}}
 else if(act==='livre'){if(r<0.75+sh){out='ok';pts=5;}else{out='ko';pts=-15;}}
 else if(act==='tele'){var p=clamp(0.5+sh,0.1,0.65);if(r<p){out='ok';pts=6;}else if(r<p+0.3){out='nul';}else{out='ko';pts=-8;}}
 else out='repos';
 if(act==='livre')st.livre=true;if(act==='usine')st.usineG=S.g;
 st.fat=clamp(st.fat+FAT[act],0,100);
 if(act==='repos'){st.cred+=9;st.sec+=15;st.dyn+=st.dyn>0?-1:st.dyn<0?1:0;}
 if(act==='discours')st.sec-=6;if(act==='usine')st.sec-=10;
 if(out==='ok'){st.cred+=CRED[act][0];st.dyn++;st.pop+=act==='usine'?5:act==='discours'?3:1;}
 if(out==='ko'){st.cred+=CRED[act][1];st.dyn--;st.pop-=3;}
 if(out==='survie'){st.sec+=35;st.pop+=12;st.dyn+=2;st.cred+=4;}
 if(act==='promesse'&&nProm>=2)st.cred-=4;
 st.cred=clamp(st.cred,0,100);st.sec=clamp(st.sec,5,100);st.pop=clamp(st.pop,0,100);st.dyn=clamp(st.dyn,-3,3);
 st.recent.push(act);if(st.recent.length>3)st.recent.shift();
 return {act:act,out:out,pts:pts};}
function promesse(c){return rnd()<0.35?c.marotte:pick(PROM[c.o]);}
function decor(c,act){return {lieu:pick(LIEUX),u:pick(USINES),p:promesse(c),t:pick(LIVRES),d:pick(LIVRES_D),q:pick(QUESTIONS)};}
function tirerEvenement(S,id,ids){
 var c=byId[id],st=S.c[id];
 var e=wpick(EVTS.map(function(ev){return [ev,typeof ev.w==='function'?ev.w(c):ev.w];}));
 var pts=typeof e.pts==='function'?e.pts(c):e.pts,rival=null,rpts=0;
 var x={media:pick(MEDIAS),truc:pick(X.truc),perso:pick(X.perso),rallie:pick(X.rallie),vid:pick(X.vid),formule:pick(X.formule),metier:pick(X.metier),gaffe:pick(X.gaffe),revel:pick(X.revel),cata:pick(X.cata),scand:pick(X.scand),marotte:c.marotte};
 if(e.rival){var others=ids.filter(function(i){return i!==id&&S.c[i].alive;});
  if(others.length){others.sort(function(a,b){return Math.abs(S.c[a].sc-st.sc)-Math.abs(S.c[b].sc-st.sc);});rival=pick(others.slice(0,4));rpts=e.rival;x.R=byId[rival].nom;}
  else x.R='Un concurrent';}
 if(e.k==='eco'){var f=pick(ECO);x.eco=f.t;pts=f.o.indexOf(c.o)>=0?4:1;x.suite=pts===4?"Le camp de {N} y voit la preuve qu'il avait raison depuis le début.":"{N} tente de s'en attribuer le mérite, sans grand succès.";}
 if(e.k==='greve'){x.suite=pts>0?"{N}, présent{e} dans les cortèges, engrange des soutiens.":pts<0?"{N}, coincé{e} dans un train à l'arrêt, peine à trouver les mots.":"{N} préfère ne pas commenter.";}
 if(pts<0){st.cred-=e.grave?10:6;st.pop-=5;st.dyn--;if(e.k==='manifc')st.sec-=10;}
 if(pts>0){st.pop+=5;st.dyn++;if(e.k==='debat')st.cred+=6;}
 st.cred=clamp(st.cred,0,100);st.sec=clamp(st.sec,5,100);st.pop=clamp(st.pop,0,100);st.dyn=clamp(st.dyn,-3,3);
 return {k:e.k,titre:T(e.titre,c,x),txt:T2(pick(e.txt),c,x),pts:pts,rival:rival,rpts:rpts,tone:pts>0?'good':pts<0?'bad':'info'};}
function choixIA(S,id,rk){
 var st=S.c[id],o=byId[id].o,duel=S.phase!=='p1';
 var w={discours:22,promesse:22,livre:9,tele:22,usine:6,repos:10};
 if(st.fat>80)w.repos*=9;else if(st.fat>62)w.repos*=4;else if(st.fat<25)w.repos*=0.3;
 if(st.sec<40){w.usine*=0.4;w.discours*=0.7;w.repos*=1.5;}
 if(st.recent.filter(function(a){return a==='promesse';}).length>=2)w.promesse*=0.3;
 var lead,trail;
 if(duel){lead=st.sc>=108;trail=st.sc<=92;}
 else{var pos=rk.indexOf(id),second=rk.length>1?S.c[rk[1]].sc:0;lead=pos<2;trail=!lead&&second-st.sc>=10;}
 if(lead){w.promesse*=1.6;w.tele*=1.3;w.repos*=1.4;w.usine*=0.35;w.livre*=0.6;w.discours*=0.8;}

function notes(S){
 var st=S.c[S.me],c=byId[S.me],L=[];
 if(st.fat>=75)L.push("{N} semble épuisé{e} par le rythme de la campagne.");

 else if(st.fat<=18)L.push("{N} est en pleine forme et tient à le faire savoir.");

 else if(st.sec<=45)L.push("Les services de sécurité recommandent davantage de prudence.");
 if(st.dyn>=2)L.push("Un vent favorable souffle sur la campagne.");
 else if(st.dyn<=-2)L.push("La campagne patine. Au QG, on parle à voix basse.");
 if(st.pop>=70)L.push("{N} est accueilli{e} comme une véritable vedette.");
 else if(st.pop<=30)L.push("Sur les marchés, les mains se tendent moins volontiers.");
 if(S.phase!=='p1'){var ad=S.duel[0]===S.me?S.duel[1]:S.duel[0],sa=S.c[ad];
  if(sa.fat>=70)L.push(T("On murmure que {N} accuse la fatigue.",byId[ad]));

function jouerTour(S,act){
 if(!dispo(S,S.me,act))return null;
 var me=S.me,C=byId[me],duel=S.phase!=='p1',ids=vivants(S),before={},raw={},dd={},une=[],brief=[];
 ids.forEach(function(i){before[i]=raw[i]=S.c[i].sc;dd[i]=0;});
 var rk=classement(S,ids),rankB=rk.indexOf(me)+1,nB=ids.length;
 var add=function(id,pts){if(!pts||!S.c[id]||!S.c[id].alive||raw[id]===undefined)return;var u=effet(S,id,pts,raw[id],duel);raw[id]=Math.max(0,raw[id]+u);dd[id]+=u;};
 var rep={phase:S.phase,turn:S.turn,act:act,before:before[me],rankB:rankB,nB:nB,rivaux:[]};
 S.stats.acts[act]=(S.stats.acts[act]||0)+1;S.stats.turns++;
 /* 1. action du joueur */
 var ra=resoudre(S,me,act),dc=decor(C,act),bloc=VOUS[act][ra.out];
 rep.out=ra.out;rep.titre=pick(bloc.t);rep.desc=T(pick(bloc.d),C,dc);
 rep.media=T(pick(REAC[ra.out]),C);rep.mediaNom=pick(MEDIAS);
 une.push({t:ra.out==='mort'?'dead':'you',s:'Vous : '+T(EUX[act][ra.out],C,dc)});

 else{add(me,ra.pts);if(ra.out==='survie')S.stats.att++;}
 /* 2. événement du joueur */
 if(S.c[me].alive&&rnd()<0.10){var ev=tirerEvenement(S,me,ids);add(me,ev.pts);if(ev.rival)add(ev.rival,ev.rpts);rep.ev=ev;S.stats.evts++;une.push({t:ev.tone==='info'?'you':ev.tone,s:'Flash : '+ev.txt});}

  if(id===me||!S.c[id].alive)return;
  var c=byId[id],a=choixIA(S,id,rk),r=resoudre(S,id,a),line=T(EUX[a][r.out],c,decor(c,a));
  brief.push(line);
  if(r.out==='mort'){S.c[id].alive=false;S.c[id].out='mort';raw[id]=0;S.stats.out++;une.push({t:'dead',s:line});rep.rivaux.push(line);return;}
  if(r.out==='survie'){une.push({t:'bad',s:line});rep.rivaux.push(line);}
  else if(duel||rk.indexOf(id)<3)rep.rivaux.push(line);
  add(id,r.pts);
  if(rnd()<0.10){var e2=tirerEvenement(S,id,ids);add(id,e2.pts);if(e2.rival)add(e2.rival,e2.rpts);une.push({t:'info',s:e2.titre+'. '+e2.txt});if(duel)rep.rivaux.push(e2.txt);}
 });
 /* 4. nouveaux sondages */
 var i;
 if(!duel){
  var w={};
  ids.forEach(function(id){var st=S.c[id];if(st.alive&&raw[id]<=0){st.alive=false;st.out='retrait';if(id!==me){S.stats.out++;une.push({t:'bad',s:T("{N}, tombé{e} à 0 %, retire sa candidature « pour raisons arithmétiques ».",byId[id])});}}
   if(st.alive)w[id]=raw[id];});
  var res=Object.keys(w).length?repartir(w,200,1):{};
  ids.forEach(function(id){S.c[id].prev=before[id];S.c[id].sc=res[id]||0;});
 }else{
  var a0=S.duel[0],b0=S.duel[1],A;
  if(!S.c[a0].alive)A=0;else if(!S.c[b0].alive)A=200;else A=clamp(before[a0]+dd[a0]-dd[b0],0,200);
  S.c[a0].prev=before[a0];S.c[b0].prev=before[b0];S.c[a0].sc=A;S.c[b0].sc=200-A;
  [a0,b0].forEach(function(id){if(S.c[id].alive&&S.c[id].sc<=0){S.c[id].alive=false;S.c[id].out='retrait';}});
 }
 S.hist[S.phase].push(instantane(S));
 var rk2=classement(S);rep.after=S.c[me].sc;rep.rankA=S.c[me].alive?rk2.indexOf(me)+1:0;rep.nA=rk2.length;
 if(S.c[me].alive){S.stats.maxU=Math.max(S.stats.maxU,rep.after);if(!duel)S.stats.bestRank=Math.min(S.stats.bestRank,rep.rankA);}
 if(rk2.length&&!duel)une.push({t:'info',s:T("Sondage du jour : {N} en tête avec "+fu(S.c[rk2[0]].sc)+".",byId[rk2[0]])});

 S.g++;
 var fin=function(type,extra){S.end={type:type};for(var k in (extra||{}))S.end[k]=extra[k];if(!S.fin1)S.fin1=figer(S);rep.next='end';};
 if(S.c[me].out==='mort')fin('assassinat');

  var ad=S.duel[0]===me?S.duel[1]:S.duel[0];
  if(!S.c[ad].alive)fin('victoire',{forfait:S.c[ad].out,ad:ad});

   S.news.push({label:'Résultats du premier tour',une:[{t:'you',s:T("{N} se qualifie pour la finale",C)+T(" face à {N}.",byId[adv])},{t:'info',s:"Les autres candidats sont éliminés. Certains appellent à voter, d'autres à réfléchir."},{t:'info',s:"Les instituts remettent les compteurs à zéro : 50 % partout. Trois tours pour départager les deux finalistes."}],brief:[]});}
 }else S.turn++;

   h+='<div class="crt evo"><div><small>VOTRE SCORE</small><span class="big">'+fu(r.before)+' ▸ <span id="tick" data-from="'+r.before+'" data-to="'+r.after+'">'+fu(r.before)+'</span></span></div>'+
   '<div><small>ÉVOLUTION</small><span class="big">'+(d>0?'▲ ':d<0?'▼ ':'')+fd(d)+'</span></div>'+
   (r.phase==='p1'&&r.rankA?'<div><small>CLASSEMENT</small><span class="big">'+ord(r.rankB,c.g==='f')+' ▸ '+ord(r.rankA,c.g==='f')+'</span></div>':'')+'</div>';
   if(note)h+='<p class="fine">'+note+'</p>';
   if(r.rivaux.length)h+='<div class="inset blk"><h4>Pendant ce temps</h4><ul>'+r.rivaux.slice(0,5).map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></div>';
  }
  h+='</div><div class="foot"><button class="btn go" data-a="next">Continuer ▸</button></div>';
 }else if(m.type==='qualif'){
  var a=byId[S.duel[0]],b=byId[S.duel[1]];
  h='<div class="tb">Résultats du premier tour</div><div class="wb"><h3>'+(a.g==='f'?'QUALIFIÉE':'QUALIFIÉ')+' POUR LA FINALE</h3>'+
  '<div class="vsrow inset" style="padding:12px"><div>'+pt(a.id,72)+esc(a.nom)+'</div><span>VS</span><div>'+pt(b.id,72)+esc(b.nom)+'</div></div>'+
  '<p>'+esc(T("Vous affronterez {N}. ",b))+'Les compteurs repartent à 50 % chacun. Il reste trois tours : le candidat en tête à la fin devient président. Votre forme, votre crédit et votre élan vous suivent dans la finale.</p></div><div class="foot"><button class="btn go" data-a="close">Aux urnes ▸</button></div>';
 }
 return '<div class="'+ovl+'" role="dialog" aria-modal="true"><div class="'+cls+'">'+h+'</div></div>';}

function rendre(){
 var app=document.getElementById('app'),h=haut();
 if(UI.screen==='title')h+=ecranTitre();
 else if(UI.screen==='select')h+=ecranChoix();
 else if(UI.screen==='mode')h+=ecranMode();
 else if(UI.screen==='game')h+=ecranJeu();
 else if(UI.screen==='end')h+=ecranFin();
 h+=modale();
 app.innerHTML=h;
 dessiner();
 var tk=document.getElementById('tick');if(tk)compter(tk);
 var mb=document.querySelector('.modal .go');if(mb)mb.focus();}
function compter(el){
 var a=+el.dataset.from,b=+el.dataset.to;
 if(a===b||(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)){el.textContent=fu(b);return;}
 var pas=Math.max(1,Math.ceil(Math.abs(b-a)/24)),cur=a,tm=setInterval(function(){
  cur+=b>a?pas:-pas;if((b>a&&cur>=b)||(b<a&&cur<=b)){cur=b;clearInterval(tm);}
  if(!el.isConnected){clearInterval(tm);return;}el.textContent=fu(cur);},45);}
function dessiner(){
 var cv=document.getElementById('chart');if(!cv||!S)return;
 var W=cv.clientWidth,H=cv.clientHeight;if(!W)return;
 var dpr=window.devicePixelRatio||1;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
 var x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
 var hist=S.hist[S.phase],ids=serieIds(),col=couleurs(ids),n=NT[S.phase],duel=S.phase!=='p1';
 var mx=0;hist.forEach(function(h){ids.forEach(function(id){mx=Math.max(mx,h[id]/2);});});
 var ymax=duel?100:Math.max(10,Math.ceil((mx+1)/5)*5),L=44,Rr=12,Tt=10,B=30,pw=W-L-Rr,ph=H-Tt-B;
 var X=function(i){return Math.round(L+pw*i/n);},Y=function(v){return Math.round(Tt+ph*(1-v/ymax));};
 x.font='16px VT323, monospace';x.textBaseline='middle';
 var step=ymax<=20?5:ymax<=50?10:25,v,i;
 for(v=0;v<=ymax;v+=step){x.fillStyle='#1e3a2a';x.fillRect(L,Y(v),pw,1);x.fillStyle='#7fb48a';x.textAlign='right';x.fillText(v+' %',L-5,Y(v));}
 x.textAlign='center';x.textBaseline='top';
 for(i=0;i<=n;i++){x.fillStyle='#1e3a2a';x.fillRect(X(i),Tt,1,ph);x.fillStyle='#7fb48a';x.fillText(i===0?(W<420?'D':'Dép.'):'T'+i,X(i),H-B+11);}
 ids.slice().reverse().forEach(function(id){
  var me=id===S.me,lw=me?3:2;x.strokeStyle=col[id];x.fillStyle=col[id];x.lineWidth=lw;x.lineJoin='miter';x.beginPath();
  hist.forEach(function(h,k){var px=X(k),py=Y(h[id]/2);if(k)x.lineTo(px,py);else x.moveTo(px,py);});x.stroke();
  hist.forEach(function(h,k){var s=me?7:5,last=k===hist.length-1;if(last)s+=2;x.fillRect(X(k)-Math.floor(s/2),Y(h[id]/2)-Math.floor(s/2),s,s);});
 });}

function ouvrirResultat(rep){
 UI.modal={type:'result',rep:rep};
 if(rep.out==='mort'||rep.out==='survie')SFX.alarme();else if(rep.ev)SFX.evt();else if(rep.out==='ok')SFX.ok();else if(rep.out==='ko')SFX.ko();else SFX.nul();}
document.addEventListener('click',function(ev){
 var b=ev.target.closest('[data-a]');if(!b||b.disabled)return;
 var a=b.dataset.a,k=b.dataset.k;
 if(a==='son'){UI.son=!UI.son;ecrire(KSON,UI.son?'1':'0');SFX.clic();}
 else if(a==='help'){UI.modal={type:'help'};SFX.clic();}
 else if(a==='close'){UI.modal=null;SFX.clic();}
 else if(a==='menu'){UI.screen='title';UI.modal=null;SFX.clic();}
 else if(a==='new'){UI.screen='select';UI.modal=null;UI.pick=null;SFX.clic();window.scrollTo(0,0);}
 else if(a==='resume'){var sv=charger();if(sv){S=sv;UI.screen=S.end?'end':'game';UI.tab='camp';}SFX.clic();}
 else if(a==='filter'){UI.filter=k;SFX.clic();}
 else if(a==='pick'){UI.pick=k;UI.screen='mode';SFX.clic();window.scrollTo(0,0);}
 else if(a==='mode'){S=nouvellePartie(UI.pick,k);sauver();UI.screen='game';UI.tab='camp';SFX.ok();window.scrollTo(0,0);}
 else if(a==='tab'){UI.tab=k;SFX.clic();window.scrollTo(0,0);}
 else if(a==='act'){if(!S||S.end||UI.modal)return;var rep=jouerTour(S,k);if(!rep)return;sauver();ouvrirResultat(rep);}
 else if(a==='next'){var r=UI.modal.rep;UI.modal=null;
  if(r.next==='end'){UI.screen='end';if(S.end.type==='victoire')SFX.gagne();else SFX.perdu();window.scrollTo(0,0);}
  else if(r.next==='qualif'){UI.modal={type:'qualif'};SFX.gagne();}
  else SFX.clic();}
 rendre();});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&UI.modal&&(UI.modal.type==='help'||UI.modal.type==='qualif')){UI.modal=null;rendre();}});
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(dessiner,120);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(dessiner);

function demarrer(data){
 UI.son=lire(KSON)!=='0';
 if(data&&data.S&&data.S.v===2&&byId[data.S.me]){S=data.S;UI.screen=data.screen||'title';UI.tab=data.tab||'camp';UI.pick=data.pick||null;if((UI.screen==='game'||UI.screen==='end')&&!S)UI.screen='title';if(UI.screen==='mode'&&!UI.pick)UI.screen='select';}
 rendre();}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(function(){return {S:S,screen:UI.screen,tab:UI.tab,pick:UI.pick};});
if(hot&&hot.ready)hot.ready(demarrer);else demarrer((hot&&hot.data)||{});
})();
</script>
